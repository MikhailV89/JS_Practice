<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="wrap">
<div class="card">
    <h2>User profile</h2>

    <div class="user">
        <span class="label">Name:</span>
        <span class="value">John</span>
    </div>

    <div class="user">
        <span class="label">Status:</span>
        <span class="value status">inactive</span>
    </div>

    <button class="activate-btn">Activate user</button>
</div>

<div class="card">
    <h2>User profile</h2>

    <div class="info">
        <div class="user">
            <span class="label">Name:</span>
            <span class="value">John</span>
        </div>
        <div class="user">
            <span class="label">Status:</span>
            <span class="value status">inactive</span>
        </div>
    </div>

    <button class="activate-btn">Activate user</button>
</div>

<div class="card">
    <h2>User profile</h2>

    <div class="info">
        <div class="user name-row">
            <span class="label">Name:</span>
            <span class="value">John</span>
        </div>

        <div class="contacts">
            <div class="user">
                <span class="label">Phone:</span>
                <span class="value">123456</span>
            </div>

            <div class="user">
                <span class="label">Email:</span>
                <span class="value email">old@mail.com</span>
            </div>
        </div>
    </div>

    <button class="change-email-btn">Change email</button>
</div>

<div class="card">
    <div class="header">
        <h2>User profile</h2>
    </div>

    <div class="body">
        <div class="left">
            <div class="user">
                <span class="label">Name:</span>
                <span class="value">John</span>
            </div>
        </div>

        <div class="right">
            <div class="user">
                <span class="label">Status:</span>
                <span class="value">active</span>
            </div>

            <div class="user">
                <span class="label">Role:</span>
                <span class="value role">user</span>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="make-admin-btn">Make admin</button>
    </div>
</div>

<div class="card">
    <h2>Product</h2>

    <div class="content">
        <div class="main-info">
            <div class="row">
                <span class="label">Name:</span>
                <span class="value">Laptop</span>
            </div>

            <div class="row">
                <span class="label">Price:</span>
                <span class="value price">$1000</span>
            </div>
        </div>

        <div class="actions">
            <button class="discount-btn">Apply discount</button>
        </div>
    </div>
</div>
</div>
<script src="js/script.js"></script>
</body>
</html>
